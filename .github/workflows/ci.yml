name: CI DevSecOps Pipeline Sesi 30

on:
  push:
    branches:
      - sesi30-devsecops
  pull_request:
    branches:
      - sesi30-devsecops
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: notes-app

jobs:
  # ---------------------------------------------------------------------------
  # 1. Job Unit Test (pytest) - S30-01
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2. Job SAST (Bandit) - S30-02
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install "$(grep -iE '^bandit==' dev-requirements.txt)"

      - name: Bandit Scan (Medium & High Severity)
        run: bandit -r app -ll

  # ---------------------------------------------------------------------------
  # 3. Job SCA (pip-audit) - S30-03 & S30-04
  # ---------------------------------------------------------------------------
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install "$(grep -iE '^pip-audit==' dev-requirements.txt)"

      - name: Audit requirements.txt (Runtime)
        run: pip-audit -r requirements.txt

      - name: Audit dev-requirements.txt (Development)
        run: pip-audit -r dev-requirements.txt

  # ---------------------------------------------------------------------------
  # 4. Job Secret Scan (Gitleaks) - S30-05
  # ---------------------------------------------------------------------------
  secret_scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Memindai seluruh riwayat commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 5. Job Build & Push Docker Image - S30-07
  # ---------------------------------------------------------------------------
  build_and_push:
    name: Build & Push Docker Image
    needs: [test, sast, sca, secret_scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image (:latest & :<commit-sha>)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 6. Job Image Scan (Trivy dari Docker Hub) - S30-08
  # ---------------------------------------------------------------------------
  image_scan:
    name: Image Scan (Trivy)
    needs: [build_and_push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trivy Scan on Published Image from Docker Hub
        uses: aquasecurity/trivy-action@0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"